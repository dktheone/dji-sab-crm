{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAB CRM | Forgot Password</title>
  
  <!-- Google Font: Source Sans Pro -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <!-- Theme style -->
  <link rel="stylesheet" href="{% static 'adminlte/css/adminlte.css' %}">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="{% static 'plugins/fontawesome-free/css/all.min.css' %}">

  <!-- Load jQuery first -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="{% static 'plugins/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'adminlte/js/adminlte.min.js' %}"></script>

</head>
<body class="hold-transition login-page">
<div class="login-box">
  <img src="{% static 'img/sab-logo-full.png' %}" height="215">
  <hr/>
  <div class="card card-outline card-primary">
    <div class="card-header text-center">
      <a href="#" class="h1"><b>SAB</b> CRM</a>
    </div>
    <div class="card-body">
      <p class="login-box-msg">Forgot your password? Enter your email address below and we'll send you instructions to reset it.</p>
      <form method="post">
        {% csrf_token %}
        
        <div class="input-group mb-3">
          {{ form.email }}
          <div class="input-group-append">
            <div class="input-group-text">
              <span class="fas fa-envelope"></span>
            </div>
          </div>
        </div>
        {% if form.email.errors %}
          <small class="text-danger">{{ form.email.errors|first }}</small>
        {% endif %}
        
        <div class="row">
          <div class="col-12">
            <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
          </div>
        </div>
      </form>
            
      <p class="mt-3 mb-1">
        <a href="/login/">Back to Login</a>
      </p>
    </div>
    <!-- /.card-body -->
  </div>
  <!-- /.card -->
</div>
<!-- /.login-box -->

</body>
</html>
