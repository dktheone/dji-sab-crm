<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAB CRM | Log In</title>

  
  <!-- Google Font: Source Sans Pro -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <!-- Theme style -->
  <!-- <link rel="stylesheet" href="{% static 'dist/css/adminlte.min.css' %}"> -->
  <link rel="stylesheet" href="{% static 'adminlte/css/adminlte.css' %}">
  
  <!-- overlayScrollbars -->
  <!-- <link rel="stylesheet" href="{% static 'plugins/overlayScrollbars/css/OverlayScrollbars.min.css' %}"> -->
  <!-- Font Awesome -->
  <link rel="stylesheet" href="{% static 'plugins/fontawesome-free/css/all.min.css' %}">

  <!-- Load jQuery first -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <!-- Then load jQuery UI -->
  <script src="https://code.jquery.com/ui/1.13.0/jquery-ui.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="{% static 'plugins/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
  
  <script src="{% static 'adminlte/js/adminlte.min.js' %}"></script>
  
  <script src="{% static 'plugins/toast-messages.js' %}"></script>


</head>
<body class="hold-transition login-page">
<div class="login-box">
  <!-- /.login-logo -->
   <img src="{% static 'img/sab-logo-full.png' %}" height="215">
   <hr/>
  <div class="card card-outline card-primary">
    <div class="card-header text-center">
      <a href="#" class="h1"><b>SAB</b> CRM</a>
    </div>
    <div class="card-body">
      <p class="login-box-msg">Sign in to start your session</p>
      <form id="loginForm" method="post">
        {% csrf_token %}
        {% for field in form %}
          <div class="input-group mb-3">
            {{field}}
            <div class="input-group-append">
              <div class="input-group-text">
                <span class="fas {% if field.name == 'username' %} fa-user {% else %}  fa-lock {% endif %}"></span>
              </div>
            </div>
          </div>
          <small class="text-danger" id="{{ field.name }}-error"></small>
        {% endfor %}
        <div class="row">
          <div class="col-12">
            <button type="submit" id="loginBtn" class="btn btn-primary btn-block">
              <span id="loginBtnText">Sign In</span>
              <span id="loginSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
            </button>
          </div>
        </div>
      </form>
      
      <!-- Error container for non-field errors -->
      <div id="login-errors" class="text-danger mt-2"></div>
            
      <p class="mb-1">
        <a href="#">I forgot my password</a>
      </p>
      <p class="mb-0">
        <a href="#" class="text-center">Register a new membership</a>
      </p>
    </div>
    <!-- /.card-body -->
  </div>
  <!-- /.card -->
</div>
<!-- /.login-box -->

<!-- jQuery -->
<script src="{% static 'plugins/jquery/jquery.min.js' %}"></script>
<!-- Bootstrap 4 -->
<script src="{% static 'plugins/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
<!-- AdminLTE App -->
<script src="{% static 'dist/js/adminlte.min.js' %}"></script>
<script src="{% static 'plugins/toast-messages.js' %}"></script>
<script>
  document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
  
      let formData = new FormData(this);
      let loginBtn = document.getElementById("loginBtn");
      let loginBtnText = document.getElementById("loginBtnText");
      let loginSpinner = document.getElementById("loginSpinner");
  
      // Show loader + disable button
      loginBtn.disabled = true;
      loginBtnText.innerText = "Signing In...";
      loginSpinner.classList.remove("d-none");
  
      fetch("", {
          method: "POST",
          body: formData,
          headers: { "X-Requested-With": "XMLHttpRequest" }
      })
      .then(response => response.json())
      .then(data => {
          if (data.status === "success") {
              window.location.href = data.redirect;
          } else {
              // Clear old errors
              document.getElementById("login-errors").innerText = "";
              document.querySelectorAll("small.text-danger").forEach(el => el.innerText = "");
  
              if (data.errors) {
                  for (const [field, messages] of Object.entries(data.errors)) {
                      if (field === "__all__") {
                          document.getElementById("login-errors").innerText = messages.join(", ");
                      } else {
                          let errorEl = document.getElementById(field + "-error");
                          if (errorEl) errorEl.innerText = messages.join(", ");
                      }
                  }
              } else if (data.message) {
                  document.getElementById("login-errors").innerText = data.message;
              }
          }
      })
      .catch(err => {
          console.error("Login request failed:", err);
          document.getElementById("login-errors").innerText = "Something went wrong. Please try again.";
      })
      .finally(() => {
          // Restore button
          loginBtn.disabled = false;
          loginBtnText.innerText = "Sign In";
          loginSpinner.classList.add("d-none");
      });
  });
  </script>
  
  

</body>
</html>
