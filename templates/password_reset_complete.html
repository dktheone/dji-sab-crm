{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAB CRM | Password Reset Complete</title>
  
  <!-- Google Font: Source Sans Pro -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <!-- Theme style -->
  <link rel="stylesheet" href="{% static 'adminlte/css/adminlte.css' %}">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="{% static 'plugins/fontawesome-free/css/all.min.css' %}">

</head>
<body class="hold-transition login-page">
<div class="login-box">
  <img src="{% static 'img/sab-logo-full.png' %}" height="215">
  <hr/>
  <div class="card card-outline card-success">
    <div class="card-header text-center">
      <a href="#" class="h1"><b>SAB</b> CRM</a>
    </div>
    <div class="card-body">
      <div class="text-center mb-3">
        <i class="fas fa-check-circle fa-4x text-success"></i>
      </div>
      <h4 class="text-center">Password Reset Successful!</h4>
      <p class="login-box-msg">Your password has been successfully reset. You can now log in with your new password.</p>
            
      <p class="mt-3 text-center">
        <a href="/login/" class="btn btn-primary btn-block">Go to Login</a>
      </p>
    </div>
    <!-- /.card-body -->
  </div>
  <!-- /.card -->
</div>
<!-- /.login-box -->

</body>
</html>
