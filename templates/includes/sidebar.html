{% load static %}
<style>
  /* Modern Compact Sidebar Overrides */
  .main-sidebar {
      background-color: #111827 !important; /* Premium deep dark slate */
      box-shadow: 0 10px 30px rgba(0,0,0,0.15) !important;
  }
  
  .brand-link {
      background-color: #1f2937 !important; /* slightly lighter dark header */
      border-bottom: 1px solid rgba(255,255,255,0.05) !important;
      padding: 0.85rem 1rem !important;
  }
  
  .brand-text {
      font-weight: 700 !important;
      letter-spacing: 0.5px;
      color: #f3f4f6 !important;
  }

  .user-panel {
      border-bottom: 1px solid rgba(255,255,255,0.06) !important;
      padding: 1rem 0.5rem !important;
  }
  
  .user-panel .info a {
      color: #e5e7eb !important;
      font-weight: 600 !important;
      font-size: 0.85rem !important;
  }

  /* Section Header Styling */
  .nav-sidebar .nav-header {
      font-size: 0.72rem !important;
      font-weight: 800 !important;
      letter-spacing: 0.08em;
      color: #9ca3af !important; /* Muted gray */
      padding: 1.5rem 1.2rem 0.5rem 1.2rem !important;
      text-transform: uppercase;
      border-top: 1px solid rgba(255,255,255,0.04);
      margin-top: 0.75rem;
  }
  
  .nav-sidebar .nav-header:first-of-type {
      border-top: none;
      margin-top: 0;
  }

  .nav-sidebar .nav-header i {
      margin-right: 0.4rem;
      color: #6366f1; /* Indigo accents on section icons */
      font-size: 0.8rem;
  }

  /* Menu Item / Module Styling */
  .nav-sidebar .nav-item {
      margin-bottom: 0.25rem;
      padding: 0 0.5rem;
  }

  .nav-sidebar .nav-link {
      border-radius: 0.375rem !important;
      padding: 0.55rem 0.75rem !important;
      font-size: 0.85rem !important;
      font-weight: 500 !important;
      color: #d1d5db !important;
      transition: all 0.2s ease-in-out !important;
      position: relative;
  }

  .nav-sidebar .nav-link:hover {
      background-color: rgba(255,255,255,0.05) !important;
      color: #fff !important;
  }

  /* Active State for Active Page */
  .nav-sidebar .nav-link.active {
      background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%) !important;
      color: #fff !important;
      font-weight: 700 !important;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35) !important;
  }
  
  /* Icon styling in active state */
  .nav-sidebar .nav-link.active .nav-icon {
      color: #fff !important;
      transform: scale(1.1);
  }
  
  /* Active State for Parent Menu (Open treeview) */
  .nav-item.menu-open > .nav-link {
      background-color: rgba(99, 102, 241, 0.12) !important;
      color: #f3f4f6 !important; /* Lighter white/slate text for readability */
      border-left: 3.5px solid #6366f1 !important;
      border-radius: 0 0.375rem 0.375rem 0 !important;
      font-weight: 600 !important;
  }
  
  .nav-item.menu-open > .nav-link .nav-icon {
      color: #818cf8 !important; /* Lighter indigo for icon */
  }
  
  .nav-item.menu-open > .nav-link .right {
      color: #818cf8 !important; /* Lighter indigo for accordion arrow */
  }

  /* Treeview Child Submenu items */
  .nav-sidebar .nav-treeview {
      background-color: rgba(0, 0, 0, 0.15) !important;
      border-radius: 0.375rem;
      margin-top: 0.15rem;
      padding: 0.2rem 0;
  }
  
  .nav-sidebar .nav-treeview .nav-item {
      padding: 0 0.25rem 0 0.75rem !important; /* Indent submenus */
  }
  
  .nav-sidebar .nav-treeview .nav-link {
      font-size: 0.8rem !important;
      color: #9ca3af !important;
      padding: 0.45rem 0.75rem !important;
  }
  
  .nav-sidebar .nav-treeview .nav-link:hover {
      color: #fff !important;
      background-color: rgba(255,255,255,0.03) !important;
  }

  /* Active Child item */
  .nav-sidebar .nav-treeview .nav-link.active {
      background: linear-gradient(135deg, #0d9488 0%, #14b8a6 100%) !important; /* Teal gradient for active subpage */
      color: #fff !important;
      box-shadow: 0 4px 10px rgba(13, 148, 136, 0.3) !important;
  }
  
  /* Compact visual indicators */
  .nav-sidebar .nav-treeview .nav-icon {
      font-size: 0.7rem !important;
      margin-right: 0.5rem !important;
  }
</style>
<!-- Main Sidebar Container -->
<aside class="main-sidebar sidebar-dark-primary elevation-4">
  <!-- Brand Logo -->
  <a href="/" class="brand-link">
    <img src="{% static '/img/sab-logo.png' %}" alt="SAB CRM" class="brand-image img-circle elevation-3"
      style="opacity: .8">
    <span class="brand-text font-weight-light">SAB CRM</span>
  </a>

  <!-- Sidebar -->
  <div class="sidebar">
    <!-- Sidebar user panel (optional) -->
    <div class="user-panel mt-3 pb-3 mb-3 d-flex">
      <div class="image">
        <img src="{% static 'img/nopic.jpg' %}" class="img-circle elevation-2" alt="User Image">
      </div>
      <div class="info">
        {% if request.user.is_authenticated %}
          <a href="#" class="d-block">[{{request.user.first_name}} {{request.user.last_name}}]</a>
        {% else %}
          <a href="#" class="d-block">Log In</a>
        {% endif %}        
      </div>
    </div>

    <!-- SidebarSearch Form -->
    <div class="form-inline">
      <div class="input-group" data-widget="sidebar-search">
        <input class="form-control form-control-sidebar" type="search" placeholder="Search" aria-label="Search">
        <div class="input-group-append">
          <button class="btn btn-sidebar">
            <i class="fas fa-search fa-fw"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Sidebar Menu -->
    <nav class="mt-2">
      {% include 'includes/menu-list.html' %}
    </nav>
    <!-- /.sidebar-menu -->
  </div>
  <!-- /.sidebar -->
</aside>
